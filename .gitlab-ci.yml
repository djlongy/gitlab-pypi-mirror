# test: the unit tests (MIRROR_SKIP_TESTS=true skips them).
# sync: downloads from PyPI, builds a wheel where only an sdist exists, uploads what the
#   registry lacks and, with MIRROR_REQUEST_URL, asks the low NiFi for each new wheel.
#   Runs on a schedule, on Run pipeline with MIRROR_SYNC=true, and on a push to the
#   default branch. Needs a runner that reaches PyPI, directly or through HTTPS_PROXY.
# export: Run pipeline with MIRROR_EXPORT_SINCE=YYYY-MM-DD bundles every wheel the
#   registry received since that day, for carrying by hand.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  # Any image with python3 3.8+ and pip. Point it at your internal registry.
  PYTHON_IMAGE: python:3.12-slim
  GIT_DEPTH: "1"

default:
  image: $PYTHON_IMAGE

stages:
  - test
  - sync

test:
  stage: test
  rules:
    - if: $MIRROR_SKIP_TESTS == "true"
      when: never
    - when: on_success
  script:
    - python3 -m unittest discover -s tests

sync:
  stage: sync
  # Two pipelines publishing at once would both see a file as missing.
  resource_group: pypi-registry
  script:
    # Reads MIRROR_REQUEST_URL, MIRROR_RESEND_PACKAGES and MIRROR_RESEND_ALL itself.
    - python3 mirror.py sync
  # Keeps the wheelhouse between runs on the same runner, so pip only fetches new files.
  cache:
    key: pypi-wheelhouse
    paths:
      - wheelhouse/
  rules:
    - if: $MIRROR_EXPORT_SINCE
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "schedule" || $MIRROR_SYNC == "true")
    # A changes rule cannot work here: compare_to the default branch compares it with itself.
    # sync uploads only what the registry lacks, so every push to the default branch runs it.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

# Recovery: every wheel the registry received since MIRROR_EXPORT_SINCE, in one tar.
export:
  stage: sync
  # Only export reads the packages API, which a job token or deploy token cannot.
  # EXPORT_TOKEN (Reporter, read_api) is for this job alone.
  variables:
    MIRROR_TOKEN: $EXPORT_TOKEN
  script:
    - python3 mirror.py export --since "$MIRROR_EXPORT_SINCE" -t bundle
  artifacts:
    name: pypi-since-$MIRROR_EXPORT_SINCE
    when: always
    paths:
      - bundle/
    expire_in: 14 days
  rules:
    - if: $MIRROR_EXPORT_SINCE
